<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:#3e3934;
  min-height:100vh;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.95), transparent 28%),
    radial-gradient(circle at 88% 20%, rgba(238,224,204,.65), transparent 30%),
    linear-gradient(135deg,#fffdf9 0%,#f7f0e7 48%,#fffdfa 100%);
  background-attachment:fixed;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    radial-gradient(rgba(116,98,78,.16) .6px,transparent .6px);
  background-size:8px 8px;
}
body::after{
  content:"";
  position:fixed;
  width:480px;
  height:480px;
  border-radius:50%;
  top:-220px;
  right:-160px;
  background:rgba(255,255,255,.75);
  filter:blur(75px);
  pointer-events:none;
}
header{
  padding:52px 20px 30px;
  text-align:center;
  position:relative;
  z-index:1;
}
header h1{
  font-size:32px;
  font-weight:700;
  letter-spacing:4px;
  color:#4a433c;
  text-shadow:0 3px 15px rgba(90,70,45,.10);
}
header p{
  color:#8b8074;
  margin-top:8px;
  font-size:14px;
  letter-spacing:1px;
}
.controls{
  max-width:1100px;
  margin:0 auto 24px;
  padding:0 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
button,.file-label{
  border:1px solid #ded2c3;
  background:rgba(255,255,255,.72);
  color:#514941;
  padding:10px 15px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
  backdrop-filter:blur(14px);
  box-shadow:0 8px 25px rgba(93,73,51,.08);
}
button:hover,.file-label:hover{
  background:#fff;
  border-color:#cdbda9;
}
#fileInput{display:none}
.gallery{
  width:min(1100px,calc(100% - 40px));
  margin:auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:24px;
  padding:8px 0 55px;
  position:relative;
  z-index:1;
}
.photo{
  position:relative;
  aspect-ratio:1/1;
  padding:10px 10px 32px;
  overflow:hidden;
  border-radius:3px;
  background:#fff;
  cursor:pointer;
  box-shadow:0 9px 22px rgba(83,65,47,.13);
  transform:rotate(var(--tilt, 0deg));
  transition:transform .35s ease,box-shadow .35s ease;
}
.photo:nth-child(3n){--tilt:1deg}
.photo:nth-child(3n+1){--tilt:-.7deg}
.photo:hover{
  transform:translateY(-7px) rotate(0deg);
  box-shadow:0 18px 35px rgba(83,65,47,.20);
}
.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .45s ease;
  border:1px solid #eee7df;
}
.photo:hover img{transform:scale(1.025)}
.empty{
  grid-column:1/-1;
  text-align:center;
  color:#8b8074;
  padding:80px 20px;
  border:1px dashed #d5c7b7;
  border-radius:14px;
  background:rgba(255,255,255,.48);
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(45,38,31,.92);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
  padding:25px;
}
.modal.show{display:flex}
.modal img{
  max-width:95vw;
  max-height:88vh;
  object-fit:contain;
  border-radius:8px;
}
.close{
  position:absolute;
  top:18px;
  right:22px;
  font-size:34px;
  color:#fff;
  background:none;
  border:0;
}
footer{
  text-align:center;
  color:#94887b;
  font-size:12px;
  padding:0 20px 25px;
  letter-spacing:1px;
}
@media(max-width:800px){
  .gallery{grid-template-columns:repeat(3,1fr);gap:14px;width:calc(100% - 24px)}
  .photo{padding:7px 7px 25px}
  header{padding-top:35px}
}
@media(max-width:500px){
  header h1{font-size:25px}
  .gallery{grid-template-columns:repeat(2,1fr);gap:12px;width:calc(100% - 18px)}
  .photo{padding:6px 6px 23px}
  .controls{padding:0 10px}
}
</style>
</head>
<body>

<header>
  <h1>PHOTO GALLERY</h1>
  <p>moments worth keeping</p>
</header>

<div class="controls">
  <span id="count">0 photos</span>
  <label class="file-label" for="fileInput">＋ Tambah Foto</label>
  <input id="fileInput" type="file" accept="image/*" multiple>
</div>

<main class="gallery" id="gallery">
  <div class="empty" id="empty">
    Belum ada foto.<br>
    Klik <b>Tambah Foto</b> untuk memasukkan foto dari perangkat.
  </div>
</main>

<div class="modal" id="modal">
  <button class="close" id="close">&times;</button>
  <img id="modalImg" src="" alt="Preview">
</div>

<footer>Personal Photo Gallery</footer>

<script>
const input = document.getElementById('fileInput');
const gallery = document.getElementById('gallery');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const close = document.getElementById('close');

let photos = [];

input.addEventListener('change', e => {
  const files = [...e.target.files].filter(f => f.type.startsWith('image/'));
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    photos.push(url);
    const item = document.createElement('div');
    item.className = 'photo';
    item.innerHTML = `<img src="${url}" alt="Photo">`;
    item.addEventListener('click', () => {
      modalImg.src = url;
      modal.classList.add('show');
    });
    gallery.appendChild(item);
  });
  empty.style.display = photos.length ? 'none' : 'block';
  count.textContent = `${photos.length} photo${photos.length === 1 ? '' : 's'}`;
  input.value = '';
});

function closeModal(){
  modal.classList.remove('show');
  modalImg.src = '';
}
close.addEventListener('click', closeModal);
modal.addEventListener('click', e => {
  if(e.target === modal) closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
